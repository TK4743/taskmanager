name: Automated Database & Report Backup

on:
  schedule:
    # 02:20 UTC = 07:50 AM IST (Morning pre-sync & previous day report backup)
    - cron: '20 2 * * *'
    # 10:20 UTC = 03:50 PM IST (Midday laboratory session sync & submission snapshot)
    - cron: '20 10 * * *'
    # 15:30 UTC = 09:00 PM IST (Evening department daily summary & reminders)
    - cron: '30 15 * * *'
    # 18:20 UTC = 11:50 PM IST (Nightly final daily report & database snapshot backup)
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date for Report Export (YYYY-MM-DD, defaults to current IST date)'
        required: false
        default: ''

concurrency:
  group: auto-backup-workflow
  cancel-in-progress: false

jobs:
  backup-and-export:
    name: Generate & Commit Backups
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Backup & Export Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/export-backup.ts "${{ github.event.inputs.target_date }}"

      - name: Dispatch Telegram Daily Automation (Group Summary & Reminders)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          npx tsx scripts/run_telegram_automation.ts auto

      - name: Commit and Push Backups to GitHub
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config --global user.name "Tharun4743"
          git config --global user.email "tharunkumark42007@gmail.com"

          git add backups/ leetcode/ tasks/
          if git diff --staged --quiet; then
            echo "No new backup changes to commit."
          else
            DATE_STR=$(date +'%Y-%m-%d')
            git commit --author="Tharun4743 <tharunkumark42007@gmail.com>" -m "chore(backup): auto-snapshot database, leetcode, and task progress reports for ${DATE_STR} [skip ci]"
            if [ -n "$SYNC_PAT" ]; then
              git push https://${SYNC_PAT}@github.com/${{ github.repository }}.git HEAD:main
            else
              git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            fi
            echo "Successfully pushed automated backup to main repository."
          fi

      - name: Sync to Secondary Repository (Dual-Repo Parity)
        if: env.SYNC_PAT != ''
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$REPO_LOWER" == *"tk4743"* ]]; then
            TARGET_REPO="https://${SYNC_PAT}@github.com/Tharun4743/taskmanager.git"
          else
            TARGET_REPO="https://${SYNC_PAT}@github.com/TK4743/taskmanager.git"
          fi
          git push "$TARGET_REPO" HEAD:main || echo "Notice: Secondary sync skipped or already up to date."
