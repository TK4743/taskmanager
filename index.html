    <main style="padding: 2rem; max-width: 1000px; margin: 0 auto; color: #1f2937; line-height: 1.6; background: #ffffff;">
      <header style="text-align: center; margin-bottom: 2.5rem;">
        <img src="/logo.png" alt="VSB Engineering College IT Task Manager Logo" width="96" height="96" style="margin-bottom: 1rem; object-fit: contain;" />
        <h1 style="font-size: 2rem; font-weight: 800; color: #111827; margin: 0.5rem 0;">IT Task Manager — VSB Engineering College (VSBEC Karur)</h1>
        <p style="font-size: 1.15rem; color: #4b5563; margin: 0;">Department of Information Technology (VSBEC IT / vsbecit / VSB IT Karur / vsbkarur)</p>
        <p style="font-size: 0.95rem; color: #6b7280; margin-top: 0.5rem;">
          Official Academic Task Governance, Coding Velocity &amp; Student Placement Progress Tracking Portal | VSB Karur (vsbkarur)
        </p>
      </header>

      <section style="margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem;">About IT Task Manager (VSBEC / VSB Karur / VSBEC IT)</h2>
        <p><strong>IT Task Manager</strong> is the official student task management, submission, verification, and placement readiness platform designed for the Information Technology department of <strong>VSB Engineering College (VSBEC, Karur, vsbkarur)</strong>. The system empowers <strong>VSBEC IT (vsbecit)</strong> students, coordinators, class advisors, and department leadership (HOD) with real-time academic task workflows, LeetCode and GitHub coding velocity analytics, automated announcements, and departmental governance.</p>
      </section>

      <section style="margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem;">Core Features &amp; Modules</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1rem;">
          <article style="padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; background: #fafafa;">
            <h3 style="font-size: 1.15rem; font-weight: 600; color: #1f2937; margin-top: 0;">Student Task Management</h3>
            <p style="margin: 0; font-size: 0.95rem; color: #4b5563;">Students can view academic assignments, filter by category (Competition, Course, Workshop, College Work), and track deadlines in real time.</p>
          </article>
          <article style="padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; background: #fafafa;">
            <h3 style="font-size: 1.15rem; font-weight: 600; color: #1f2937; margin-top: 0;">Task Submission & Verification Workflow</h3>
            <p style="margin: 0; font-size: 0.95rem; color: #4b5563;">Multi-tier verification workflow supporting individual and team submissions, screenshot proof uploads via Cloud CDN, and feedback with resubmission support.</p>
          </article>
          <article style="padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; background: #fafafa;">
            <h3 style="font-size: 1.15rem; font-weight: 600; color: #1f2937; margin-top: 0;">LeetCode Progress Tracking</h3>
            <p style="margin: 0; font-size: 0.95rem; color: #4b5563;">Real-time LeetCode problem solve velocity tracking, Easy/Medium/Hard breakdown, dynamic target setting, and automated streak monitoring.</p>
          </article>
          <article style="padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; background: #fafafa;">
            <h3 style="font-size: 1.15rem; font-weight: 600; color: #1f2937; margin-top: 0;">GitHub Progress Tracking</h3>
            <p style="margin: 0; font-size: 0.95rem; color: #4b5563;">Synchronized tracking of daily and weekly student GitHub commits with combined coding performance analytics.</p>
