      });
    }

    // Force purge obsolete service worker, runtime caches, and modal flags
    try {
      sessionStorage.removeItem('mandatory_compliance_dismissed_v1');
      localStorage.removeItem('pwa_install_dismissed');
      localStorage.removeItem('pwa_prompt_dismissed');
      localStorage.removeItem('pwa_install_dismissed_v1');
      localStorage.removeItem('pwa_installed');
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((k) => {
            caches.delete(k);
          });
        });
      }
    } catch (e) {}
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
